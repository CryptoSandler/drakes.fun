name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typecheck, lint, and the copy lexicon guard (DESIGN.md §6).
      - run: npm run verify
      # The page is dynamic and reads its config at request time, so this needs
      # no environment. It is here to catch a build that only breaks on deploy.
      - run: npm run build

  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Host tests only -- no SBF toolchain needed. These carry the vectors that
      # keep the program's merkle and modulo byte-identical to the TypeScript
      # the cranker and the public verify command run.
      - run: cargo test -p issuance
